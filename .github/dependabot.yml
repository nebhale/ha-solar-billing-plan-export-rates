version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # The test plugin pins Home Assistant and pytest packages; update them together.
      home-assistant:
        patterns:
          - homeassistant
          - "pytest*"
      python-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - homeassistant
          - "pytest*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
