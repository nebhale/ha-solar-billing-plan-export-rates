[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"
"tests".msg = "You should not import tests"
"__future__.annotations".msg = "It should not be needed because Home Assistant requires Python 3.14+"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]

# Allow for main entry & scripts to write to stdout
"scripts/*" = ["T20"]

# Allow relative imports within the custom integration
"custom_components/solar_billing_plan_export_rates/*" = ["TID252"]

# Temporary, matching Home Assistant Core.
"custom_components/**" = ["PTH"]
"tests/**" = ["PTH", "TID251"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"
property-decorators = ["propcache.api.cached_property"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false

[dependency-groups]
lint = [
    "mypy==2.1.0",
    "pylint==4.0.6",
    "pylint-per-file-ignores==3.2.1",
    "ruff==0.15.18",
]
test = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-homeassistant-custom-component==0.13.340",
]

[tool.pylint.MAIN]
py-version = "3.14"
jobs = 2
load-plugins = [
    "pylint.extensions.code_style",
    "pylint.extensions.typing",
    "pylint_per_file_ignores",
]
persistent = false
fail-on = ["I"]

[tool.pylint.BASIC]
class-const-naming-style = "any"

